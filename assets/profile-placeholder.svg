<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Nehir Macar için stilize edilmiş profil illüstrasyonu">
  <defs>
    <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6dde2"/>
      <stop offset="100%" stop-color="#dcebf7"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#caa6ac"/>
      <stop offset="100%" stop-color="#b98c95"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3b6c4"/>
      <stop offset="100%" stop-color="#e28ba0"/>
    </linearGradient>
  </defs>

  <!-- arka plan blob -->
  <path fill="url(#blob)" d="M210,20 C300,15 390,70 395,170 C400,270 340,360 230,395 C120,430 30,360 15,250 C0,140 60,90 130,55 C155,42 180,22 210,20 Z"/>

  <!-- basit, soyut silüet -->
  <g>
    <ellipse cx="210" cy="255" rx="95" ry="110" fill="#ffffff" opacity="0.55"/>
    <circle cx="210" cy="170" r="72" fill="#fff1f4"/>
    <path fill="url(#hair)" d="M138,150 C130,95 175,55 210,55 C248,55 292,95 284,152 C284,120 262,110 245,120 C230,90 190,90 176,120 C158,112 140,124 138,150 Z"/>
    <path fill="#ffffff" d="M140,255 C140,190 170,215 210,215 C250,215 280,190 280,255 L280,340 C280,340 250,360 210,360 C170,360 140,340 140,340 Z" opacity="0.9"/>
  </g>

  <!-- sakura dalı süslemesi -->
  <g transform="translate(300,60) rotate(20)">
    <path d="M0,0 C10,20 20,35 45,50" stroke="#b98c95" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="url(#petal)">
      <circle cx="4" cy="6" r="7"/>
      <circle cx="20" cy="24" r="8"/>
      <circle cx="40" cy="46" r="9"/>
    </g>
  </g>
  <g transform="translate(60,320) rotate(-15)">
    <path d="M0,0 C-8,15 -14,28 -30,38" stroke="#b98c95" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <g fill="url(#petal)">
      <circle cx="-2" cy="4" r="6"/>
      <circle cx="-16" cy="20" r="7"/>
    </g>
  </g>
</svg>
